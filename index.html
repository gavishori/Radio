<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5c">
<title>רדיו נקי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Heebo:wght@400;500&display=swap">
<style>
/* Layout: filters on top, a grid of station tiles, and a player bar pinned to the bottom */
:root {
  --bg: #eef1f0; --surface: #ffffff; --fg: #17201d; --muted: #5d6b66;
  --line: #d5dcd9; --accent: #0f7a5c; --accent-fg: #ffffff; --live: #d23c2a; --heart: #e0365a;
  /* Tile colors, one per topic */
  --t-news: #3b5b8c; --t-israeli: #2f7d6d; --t-jazz: #8a5a2b; --t-classical: #6b4f8f;
  --t-rock: #a23b3b; --t-electronic: #2c6f8f; --t-eclectic: #4d6b2f; --t-world: #a0632a;
  --t-pop: #b04a7a; --t-chill: #4a7f86; --t-culture: #6d5a3f; --t-groove: #7a3f7f; --t-mizrahi: #b5702a; --t-religion: #4f6a8a; --t-country: #8c6d1f; --t-decades: #c0563a; --t-ballads: #7d5a9e; --t-love: #c2416b; --t-hindi: #d0731c; --t-mine: #55605c;
  --display: "Rubik", "Segoe UI", Arial, sans-serif;
  --body: "Heebo", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101614; --surface: #19211e; --fg: #e6ece9; --muted: #93a39d;
    --line: #2a3531; --accent: #3cc497; --accent-fg: #06130e; --live: #ff6b57; --heart: #ff5c7c; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
header h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Tabs: all / favorites */
.sync { font-size: 13px; color: var(--muted); }
.sync.ok::before { content: "● "; color: var(--accent); }
.sync.off::before { content: "● "; color: var(--live); }
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; width: fit-content; max-width: 100%; }
.tab { border: 0; background: none; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }

/* Filters */
.filters { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 180px; min-width: 0; }
.field span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.field select, .field input {
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); width: 100%;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px;
  cursor: pointer; font-size: 14px;
}
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: 0 0 0 1px rgb(255 255 255 / .5); }
.count { color: var(--muted); font-size: 13px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; user-select: none; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgb(0 0 0 / .25); margin-bottom: 4px; }

/* Station grid */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 16px; border: 0; cursor: pointer;
  background: var(--tile, var(--t-mine)); color: #fff; padding: 14px; text-align: start;
  display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  transition: transform .12s ease, box-shadow .12s ease;
}
.tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.tile.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
.tile .big { font: 700 30px/1 var(--display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.tile .name { font: 500 15px/1.25 var(--display); }
.tile .meta { font-size: 12px; opacity: .85; }
.tile .bottom { min-width: 0; }
.np { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgb(255 255 255 / .25); min-width: 0; }
.np .song, .np .artist, .p-song { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .song { font: 500 13px/1.3 var(--display); }
.np .artist { font-size: 12px; opacity: .85; }
/* A tile showing a song makes room for it: one-line station name, smaller frequency */
.tile.has-np .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.has-np .big { font-size: 24px; }
.tile.has-np .badge { margin-bottom: 2px; }
.tile::after { /* soft dial ring in the corner */
  content: ""; position: absolute; inset-inline-start: -30%; bottom: -30%; width: 80%; aspect-ratio: 1;
  border-radius: 50%; border: 14px solid rgb(255 255 255 / .08); pointer-events: none;
}
.fav {
  position: absolute; top: 8px; inset-inline-end: 8px; width: 34px; height: 34px; border-radius: 50%;
  border: 0; background: rgb(0 0 0 / .18); color: #fff; cursor: pointer; display: grid; place-items: center; z-index: 1;
}
.fav svg { width: 18px; height: 18px; }
.fav[aria-pressed="true"] { background: #fff; color: var(--heart); }
.del { position: absolute; top: 8px; inset-inline-start: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: rgb(0 0 0 / .18); color: #fff; cursor: pointer; font-size: 18px; line-height: 1; z-index: 1; }
.eq { display: none; gap: 3px; align-items: flex-end; height: 16px; }
.tile.playing .eq { display: flex; }
.eq i { width: 4px; background: #fff; border-radius: 2px; animation: eq 1s infinite ease-in-out; }
.eq i:nth-child(2) { animation-delay: -.4s; } .eq i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 0%,100% { height: 4px; } 50% { height: 16px; } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 10px; } .tile { transition: none; } }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font: 500 17px var(--display); margin-bottom: 4px; }

/* Add your own station */
details.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
details.add summary { cursor: pointer; font-weight: 500; }
.add form { display: grid; gap: 8px; margin-top: 10px; }
.add input { flex: 1 1 160px; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.add button { padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 500; cursor: pointer; }
.note { color: var(--muted); font-size: 13px; margin: 0; }

/* Player bar */
.player {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgb(0 0 0 / .08);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.player-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.p-art { flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--tile, var(--t-mine)); color: #fff;
  display: grid; place-items: center; font: 700 14px var(--display); overflow: hidden; }
.p-info { flex: 1 1 140px; min-width: 0; }
.p-name { font: 500 16px/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.status.live { color: var(--live); }
.status.live .dot { background: var(--live); animation: pulse 1.4s infinite; }
.status.err { color: var(--live); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status.live .dot { animation: none; } }
.p-btns { display: flex; align-items: center; gap: 8px; direction: ltr; } /* media controls keep their standard order in RTL */
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
.icon-btn.faved { color: var(--heart); }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.play svg { width: 22px; height: 22px; fill: currentColor; }
.vol { display: flex; align-items: center; gap: 8px; flex: 0 1 180px; color: var(--muted); }
.vol input { width: 100%; accent-color: var(--accent); }
@media (max-width: 560px) {
  .vol { display: none; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile .big { font-size: 24px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>רדיו נקי</h1>
    <p>תחנות מישראל ומכל העולם. תחנות שמשדרות פרסומות מסומנות, ואפשר להסתיר אותן.</p>
  </header>

  <div class="row">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabAll" aria-selected="true">כל התחנות</button>
      <button class="tab" role="tab" id="tabFav" aria-selected="false">המועדפים שלי</button>
    </div>
    <span class="sync" id="sync">מתחבר לסנכרון…</span>
  </div>

  <div class="filters">
    <div class="row">
      <label class="field" for="country"><span>מדינה</span><select id="country"></select></label>
      <label class="field" for="search"><span>חיפוש</span><input id="search" type="search" placeholder="שם תחנה…"></label>
    </div>
    <div class="chips" id="topics" aria-label="נושאים"></div>
    <div class="row"><label class="toggle" for="noAds"><input id="noAds" type="checkbox"> רק תחנות בלי פרסומות</label><span class="count" id="count"></span></div>
  </div>

  <div class="grid" id="grid"></div>

  <details class="add">
    <summary>הוספת תחנה משלכם</summary>
    <form id="addForm">
      <div class="row">
        <input id="addName" placeholder="שם התחנה" required>
        <input id="addUrl" placeholder="כתובת סטרים (https://…mp3)" dir="ltr" required>
        <button type="submit">הוספה</button>
      </div>
      <p class="note">התחנות שתוסיפו נשמרות בדפדפן הזה בלבד, ומופיעות תחת "התחנות שלי" ברשימת המדינות.</p>
    </form>
  </details>
</div>

<div class="player" aria-live="polite">
  <div class="player-in">
    <div class="p-art" id="pArt">—</div>
    <div class="p-info">
      <div class="p-name" id="pName">בחרו תחנה</div>
      <div class="p-song" id="pSong" dir="auto" hidden></div>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">לחיצה על ריבוע מתחילה לנגן</span></span>
    </div>
    <div class="p-btns">
      <button class="icon-btn" id="pFav" aria-label="הוספה למועדפים"></button>
      <button class="icon-btn" id="prevBtn" aria-label="התחנה הקודמת"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 12l8.5 6V6z"/></svg></button>
      <button class="play" id="playBtn" aria-label="נגן"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="icon-btn" id="nextBtn" aria-label="התחנה הבאה"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg></button>
    </div>
    <label class="vol" for="vol"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="עוצמה"></label>
  </div>
</div>

<audio id="audio" preload="none"></audio>

function buildFilters() {
  const base = state.tab === "fav" ? all().filter(s => favs.has(s.id)) : all();
  const counts = {};
  for (const s of base) counts[s.country] = (counts[s.country] || 0) + 1;
  $("country").innerHTML = `<option value="">כל המדינות (${base.length})</option>` +
    Object.keys(COUNTRIES).filter(c => counts[c]).map(c => `<option value="${c}">${COUNTRIES[c]} (${counts[c]})</option>`).join("");
  if (F().country && !counts[F().country]) F().country = "";
  $("country").value = F().country;

  $("topics").innerHTML = "";
  const used = new Set(all().flatMap(s => s.topics).filter(t => t in TOPICS));
  if (F().topic && !used.has(F().topic)) F().topic = "";  // a saved topic that no longer has a button
  for (const [key, label] of [["", "הכול"], ...Object.entries(TOPICS).filter(([k]) => used.has(k))]) {
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = key ? `<span class="swatch" style="background: var(--t-${key})"></span>` : "";
    b.append(label);
    b.setAttribute("aria-pressed", F().topic === key);
    b.onclick = () => { F().topic = key; if (state.tab === "all") store.set("topic", key); buildFilters(); renderGrid(); };
    $("topics").appendChild(b);

}

// ---- Favorites sync between devices (Firebase Realtime Database, same project as the Timer app) ----
// localStorage is the instant local cache; Firebase is the source of truth shared by every device.
const FAVS_URL = "https://timer-4672a-default-rtdb.europe-west1.firebasedatabase.app/app-1b3c84cf218410393163a85b/radio-favs.json";

function setSync(text, cls) {
  $("sync").textContent = text;
  $("sync").className = "sync " + cls;
}

function saveFavs() {
  store.set("favs", [...favs]);
  fetch(FAVS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify([...favs]) })
    .catch(() => setSync("לא מחובר לסנכרון, נשמר רק במכשיר הזה", "off"));
}

function applyRemoteFavs(value) {
  const list = Array.isArray(value) ? value : value ? Object.values(value) : [];
  favs = new Set(list.filter(id => typeof id === "string"));
  store.set("favs", [...favs]);
  if (state.tab === "fav") buildFilters();
  renderGrid(); renderPlayer();
}

function connectSync() {
  let first = true;
  let es;
  try { es = new EventSource(FAVS_URL); } catch { setSync("לא מחובר לסנכרון", "off"); return; }
  es.addEventListener("put", e => {
    setSync("המועדפים מסונכרנים בין המכשירים", "ok");
    try {
      const { data } = JSON.parse(e.data);
      const remote = Array.isArray(data) ? data : data ? Object.values(data) : [];
      if (first && !store.get("synced", false)) {
        // This device's very first sync: merge favorites saved here before sync existed, so nothing is lost.
        // After that the cloud always wins, so a favorite removed on one device stays removed everywhere.
        store.set("synced", true);
        const merged = new Set([...remote, ...favs]);
        if (merged.size !== remote.length) { first = false; favs = merged; saveFavs(); applyRemoteFavs([...merged]); return; }
      }
      first = false;
      applyRemoteFavs(remote);
    } catch {}
  });
  // Every save writes the whole list, so a partial update means someone edited it by hand: reload it
  es.addEventListener("patch", () => fetch(FAVS_URL).then(r => r.json()).then(applyRemoteFavs).catch(() => {}));
  es.onerror = () => setSync("לא מחובר לסנכרון, נשמר רק במכשיר הזה", "off");
}

function setStatus(text, cls) {
  $("statusText").textContent = text;

function renderPlayer() {
  const playing = current && !audio.paused;
  $("playIcon").innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("playBtn").setAttribute("aria-label", playing ? "עצירה" : "נגן");
  $("pFav").hidden = !current;
  if (!current) return;
  const f = favs.has(current.id);
  $("pFav").innerHTML = HEART(f);
  $("pFav").classList.toggle("faved", f);
  $("pFav").setAttribute("aria-label", f ? "הסרה מהמועדפים" : "הוספה למועדפים");
  $("pName").textContent = current.name;
  $("pArt").textContent = current.label;
  $("pArt").style.setProperty("--tile", tileColor(current));
  const np = nowPlaying[current.id];
  $("pSong").hidden = !np;
  if (np) $("pSong").textContent = np.artist ? `${np.title} · ${np.artist}` : np.title;
  if ("mediaSession" in navigator && playing) {
    navigator.mediaSession.metadata = new MediaMetadata(np
      ? { title: np.title, artist: np.artist || current.name, album: current.name }
      : { title: current.name, artist: `${COUNTRIES[current.country]} · ${current.desc}`, album: "רדיו נקי" });
  }
}

const clean = v => (v || "").replace(/`/g, "'").replace(/\s+/g, " ").trim();
function track(title, artist) {
  title = clean(title); artist = clean(artist);
  if (!title || /commercial|advertisement|text=|after this break/i.test(title + " " + artist)) return null;
  return { title, artist };
}

async function readIcy(url, titleFirst) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(url, { headers: { "Icy-MetaData": "1" }, signal: ctrl.signal, cache: "no-store" });
    const metaint = +r.headers.get("icy-metaint");
    if (!metaint) return null;
    // Read just past the first audio block to reach the metadata block, then hang up
    const reader = r.body.getReader();
    let buf = new Uint8Array(0);
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return null;
      const next = new Uint8Array(buf.length + value.length); next.set(buf); next.set(value, buf.length); buf = next;
      if (buf.length > metaint && buf.length >= metaint + 1 + buf[metaint] * 16) break;
    }
    const meta = new TextDecoder().decode(buf.slice(metaint + 1, metaint + 1 + buf[metaint] * 16));
    const m = meta.match(/StreamTitle='(.*?)';/);
    if (!m) return null;
    const [a, ...rest] = m[1].split(" - ");
    return titleFirst ? track(a, rest[0]) : track(rest.join(" - "), a);
  } finally { clearTimeout(timer); ctrl.abort(); }
}

async function fetchNowPlaying(s) {
  const [kind, arg] = NP_SOURCES[s.id].split(":");
  const json = u => fetch(u, { cache: "no-store" }).then(r => r.json());
  const xml = u => fetch(u, { cache: "no-store" }).then(r => r.text()).then(t => new DOMParser().parseFromString(t, "text/xml"));
  if (kind === "icy") return readIcy(s.url, false);
  if (kind === "icy-title-first") return readIcy(s.url, true);
  if (kind === "kexp") {
    const p = (await json("https://api.kexp.org/v2/plays/?limit=1")).results[0];
    return p && p.play_type === "trackplay" ? track(p.song, p.artist) : null;
  }
  if (kind === "kcrw") { const d = await json(`https://tracklist-api.kcrw.com/${arg}`); return track(d.title, d.artist); }
  if (kind === "current") { const d = (await json("https://nowplaying.publicradio.org/the-current/playlist")).data.songs[0]; return d && track(d.title, d.artist); }
  if (kind === "securenet") {
    const d = await xml(`https://streamdb3web.securenetsystems.net/player_status_update/${arg}.xml`);
    return track(d.querySelector("title")?.textContent, d.querySelector("artist")?.textContent);
  }
  if (kind === "triton") {
    const d = await xml(`https://np.tritondigital.com/public/nowplaying?mountName=${arg}&numberToFetch=1&eventType=track`);
    const prop = n => d.querySelector(`property[name="${n}"]`)?.textContent;
    return track(prop("cue_title"), prop("track_artist_name"));
  }
  return null;
}

function fillNowPlaying(tile, id) {
  const np = nowPlaying[id];
  tile.querySelector(".np").hidden = !np;
  tile.querySelector(".meta").hidden = !!np;
  tile.classList.toggle("has-np", !!np);
  if (np) {
    tile.querySelector(".song").textContent = np.title;
    tile.querySelector(".artist").textContent = np.artist;
  }
}

async function refreshNowPlaying() {
  if (document.hidden) return;
  const ids = new Set(visible.map(s => s.id));
  if (current) ids.add(current.id);
  const due = all().filter(s => ids.has(s.id) && NP_SOURCES[s.id] && !(Date.now() - (npFetchedAt[s.id] || 0) < NP_TTL));
  await Promise.all(due.map(async s => {
    npFetchedAt[s.id] = Date.now();
    let np = null;
    try { np = await fetchNowPlaying(s); } catch {}
    const before = JSON.stringify(nowPlaying[s.id] || null);
    if (np) nowPlaying[s.id] = np; else delete nowPlaying[s.id];
    if (JSON.stringify(np) === before) return;
    const tile = document.querySelector(`.tile[data-id="${s.id}"]`);
    if (tile) fillNowPlaying(tile, s.id);
    if (current && current.id === s.id) renderPlayer();
  }));
}
setInterval(refreshNowPlaying, 10000);
document.addEventListener("visibilitychange", refreshNowPlaying);

function tune(s) {
  current = s;
  store.set("last", s.id);
  // Cache-bust so a resumed live stream starts at "now", not from a stale buffer
  audio.src = s.url + (s.url.includes("?") ? "&" : "?") + "t=" + Date.now();
  setStatus("מתחבר…");
  audio.play().catch(() => {});
  renderPlayer(); renderGrid();
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: `${COUNTRIES[s.country]} · ${s.desc}`, album: "רדיו נקי" });
  }
}

function stop() {
  audio.pause(); audio.removeAttribute("src"); audio.load();
  setStatus("מושהה"); renderPlayer(); renderGrid();
}

function toggle() {
  if (!current) { const first = visible[0] || all()[0]; if (first) tune(first); return; }
  audio.paused ? tune(current) : stop();
}

function step(dir) {
  const list = visible.length ? visible : all();
  const i = list.findIndex(s => current && s.id === current.id);
  tune(list[(i + dir + list.length) % list.length]);
}

audio.addEventListener("playing", () => { setStatus("בשידור חי", "live"); renderPlayer(); renderGrid(); });
audio.addEventListener("waiting", () => setStatus("טוען…"));
audio.addEventListener("error", () => {
  if (!audio.getAttribute("src")) return;
  setStatus("התחנה לא זמינה כרגע. נסו תחנה אחרת.", "err"); renderPlayer(); renderGrid();
});

$("playBtn").onclick = toggle;
$("nextBtn").onclick = () => step(1);
$("prevBtn").onclick = () => step(-1);
$("pFav").onclick = () => current && toggleFav(current.id);
$("tabAll").onclick = () => { state.tab = "all"; store.set("tab", "all"); buildFilters(); renderGrid(); };
$("tabFav").onclick = () => { state.tab = "fav"; store.set("tab", "fav"); state.f.fav = { country: "", topic: "" }; buildFilters(); renderGrid(); };
$("country").onchange = e => { F().country = e.target.value; if (state.tab === "all") store.set("country", F().country); renderGrid(); };
$("noAds").checked = state.noAds;
$("noAds").onchange = e => { state.noAds = e.target.checked; store.set("noAds", state.noAds); renderGrid(); };
$("search").oninput = e => { state.q = e.target.value; renderGrid(); };

$("vol").value = store.get("vol", 0.8);
audio.volume = +$("vol").value;
$("vol").oninput = e => { audio.volume = +e.target.value; store.set("vol", audio.volume); };

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !/INPUT|BUTTON|SELECT/.test(document.activeElement.tagName) && !document.activeElement.classList.contains("tile")) {
    e.preventDefault(); toggle();
  }
});

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", toggle);
  navigator.mediaSession.setActionHandler("pause", toggle);
  navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
}

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("addName").value.trim(), url = $("addUrl").value.trim();
  if (!/^https?:\/\//.test(url)) { setStatus("הכתובת צריכה להתחיל ב-https://", "err"); return; }
  const s = { id: "c" + Date.now(), name, url, label: "★", country: "MY", topics: [], desc: "תחנה שהוספתם" };
  custom.push(s);
  store.set("custom", custom.map(({ id, name, url }) => ({ id, name, url })));
  e.target.reset();
  state.tab = "all"; state.f.all.country = "MY"; store.set("country", "MY");
  buildFilters(); renderGrid();
});

// Forget favorites of stations that were removed from the list (locally only; the cloud copy arrives next)
favs = new Set([...favs].filter(id => all().some(s => s.id === id)));
store.set("favs", [...favs]);
// Restore the last station into the player without autoplaying (browsers need a tap first)
current = all().find(s => s.id === store.get("last")) || null;
if (state.tab === "fav" && !favs.size) state.tab = "all";
buildFilters(); renderGrid(); renderPlayer();
if (current) setStatus("לחצו נגן כדי להמשיך להאזין");
connectSync();
refreshNowPlaying();
</script>
